[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-tool-orchestrator"
version = "1.0.0"
description = "Dependency-free multi-agent framework: tool calling, policies, memory, and supervisor routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arun Sreedhar" }]
keywords = ["agents", "agentic-ai", "tool-calling", "llm", "orchestration", "mcp"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
